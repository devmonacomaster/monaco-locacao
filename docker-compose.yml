services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: monaco-locacao
        restart: unless-stopped
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            LOG_CHANNEL: stderr
        volumes:
            - vehicle-storage:/var/www/html/storage/app/public

volumes:
    vehicle-storage:
